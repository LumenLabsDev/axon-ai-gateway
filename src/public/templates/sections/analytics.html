<!-- Analytics Section -->
<div x-show="$store.app.currentSection === 'analytics'" x-data="analyticsManager" style="display: none;">
  <!-- Time Range Selector -->
  <div style="margin-bottom: 1.5rem;">
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button 
        class="btn btn-sm" 
        :class="timeRange === '1h' ? 'btn-primary' : 'btn-secondary'"
        @click="changeTimeRange('1h')"
      >
        Last Hour
      </button>
      <button 
        class="btn btn-sm" 
        :class="timeRange === '24h' ? 'btn-primary' : 'btn-secondary'"
        @click="changeTimeRange('24h')"
      >
        Last 24 Hours
      </button>
      <button 
        class="btn btn-sm" 
        :class="timeRange === '7d' ? 'btn-primary' : 'btn-secondary'"
        @click="changeTimeRange('7d')"
      >
        Last 7 Days
      </button>
      <button 
        class="btn btn-sm" 
        :class="timeRange === '30d' ? 'btn-primary' : 'btn-secondary'"
        @click="changeTimeRange('30d')"
      >
        Last 30 Days
      </button>
    </div>
  </div>

  <div x-show="loading" class="loading-container">
    <div class="loading-spinner"></div>
  </div>

  <div x-show="!loading">
    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Requests</div>
        <div class="stat-value" x-text="stats.totalRequests.toLocaleString()"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Success Rate</div>
        <div class="stat-value" x-text="stats.successRate.toFixed(1) + '%'"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Response Time</div>
        <div class="stat-value" x-text="stats.avgResponseTime.toFixed(0) + 'ms'"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Tokens</div>
        <div class="stat-value" x-text="stats.totalTokens.toLocaleString()"></div>
      </div>
    </div>

    <!-- Charts Row -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1.75rem; margin-bottom: 2rem;">
      <!-- Requests by Model -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Requests by Model</h2>
        </div>
        <div style="padding: 1rem;">
          <template x-for="[model, count] in Object.entries(stats.requestsByModel)" :key="model">
            <div style="margin-bottom: 1rem;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="font-size: 0.875rem; font-weight: 500;" x-text="model"></span>
                <span style="font-size: 0.875rem; color: #6b7280;" x-text="count.toLocaleString()"></span>
              </div>
              <div style="width: 100%; height: 8px; background: #f3f4f6; border-radius: 4px; overflow: hidden;">
                <div 
                  style="height: 100%; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);"
                  :style="`width: ${Utils.percentage(count, stats.totalRequests)}%`"
                ></div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- Requests by Status -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Requests by Status</h2>
        </div>
        <div style="padding: 1rem;">
          <template x-for="[status, count] in Object.entries(stats.requestsByStatus)" :key="status">
            <div style="margin-bottom: 1rem;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="font-size: 0.875rem; font-weight: 500;">
                  <span 
                    class="badge" 
                    :class="status.startsWith('2') ? 'badge-green' : (status.startsWith('4') ? 'badge-yellow' : 'badge-red')" 
                    x-text="status"
                  ></span>
                </span>
                <span style="font-size: 0.875rem; color: #6b7280;" x-text="count.toLocaleString()"></span>
              </div>
              <div style="width: 100%; height: 8px; background: #f3f4f6; border-radius: 4px; overflow: hidden;">
                <div 
                  style="height: 100%;"
                  :style="`width: ${Utils.percentage(count, stats.totalRequests)}%; background: ${status.startsWith('2') ? '#22c55e' : (status.startsWith('4') ? '#f59e0b' : '#dc2626')};`"
                ></div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Export Button -->
    <div style="text-align: right;">
      <button class="btn btn-secondary" @click="Utils.downloadJSON(stats, 'analytics-' + new Date().toISOString().split('T')[0] + '.json')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 16px; height: 16px;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Export Analytics
      </button>
    </div>
  </div>
</div>
