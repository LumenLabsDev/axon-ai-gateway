<!-- Provider Keys Section -->
<div x-show="$store.app.currentSection === 'provider-keys'" x-data="providerKeysManager" style="display: none;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Provider Keys</h2>
      <button class="btn btn-primary" @click="showCreateModal = true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 16px; height: 16px;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add Provider Key
      </button>
    </div>
    
    <div x-show="loading" class="loading-container">
      <div class="loading-spinner"></div>
    </div>
    
    <div x-show="!loading && keys.length === 0" class="empty-state">
      <div class="empty-state-title">No Provider Keys</div>
      <p class="empty-state-text">Add API keys for AI providers like OpenAI, Anthropic, etc.</p>
      <button class="btn btn-primary" @click="showCreateModal = true">Add Provider Key</button>
    </div>
    
    <div x-show="!loading && keys.length > 0" class="table-container">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Provider</th>
            <th>Key</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="key in keys" :key="key.id">
            <tr>
              <td><strong x-text="key.name"></strong></td>
              <td><span class="badge badge-blue" x-text="key.provider"></span></td>
              <td><code style="font-size: 0.813rem;" x-text="key.encryptedKey"></code></td>
              <td x-text="new Date(key.createdAt).toLocaleDateString()"></td>
              <td>
                <div class="table-actions">
                  <button class="btn btn-secondary btn-sm" @click="editKey(key)">Edit</button>
                  <button class="btn btn-danger btn-sm" @click="deleteKey(key)">Delete</button>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div x-show="showCreateModal || showEditModal" class="modal-overlay" x-cloak style="display: none;">
    <div class="modal" @click.away="showCreateModal = false; showEditModal = false;">
      <div class="modal-header">
        <h2 class="modal-title" x-text="showEditModal ? 'Edit Provider Key' : 'Add Provider Key'"></h2>
        <button class="modal-close" @click="showCreateModal = false; showEditModal = false;">&times;</button>
      </div>
      <form @submit.prevent="showEditModal ? updateKey() : createKey()">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="provider-key-name">Name *</label>
            <input type="text" id="provider-key-name" class="form-input" x-model="formData.name" required placeholder="e.g., OpenAI Production" />
          </div>
          
          <div class="form-group" x-show="!showEditModal">
            <label class="form-label" for="provider-key-provider">Provider *</label>
            <select id="provider-key-provider" class="form-select" x-model="formData.provider" required>
              <option value="">Select Provider</option>
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
              <option value="google">Google (Gemini)</option>
              <option value="cohere">Cohere</option>
              <option value="azure-openai">Azure OpenAI</option>
              <option value="bedrock">AWS Bedrock</option>
              <option value="groq">Groq</option>
              <option value="mistral-ai">Mistral AI</option>
              <option value="perplexity-ai">Perplexity AI</option>
              <option value="together-ai">Together AI</option>
            </select>
          </div>
          
          <div class="form-group" x-show="!showEditModal">
            <label class="form-label" for="provider-key-apikey">API Key *</label>
            <input type="password" id="provider-key-apikey" class="form-input" x-model="formData.apiKey" :required="!showEditModal" placeholder="sk-..." autocomplete="off" />
            <p class="form-help">Your API key will be encrypted and stored securely.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" @click="showCreateModal = false; showEditModal = false;">Cancel</button>
          <button type="submit" class="btn btn-primary" :disabled="submitting">
            <span x-show="!submitting" x-text="showEditModal ? 'Update' : 'Add'"></span>
            <span x-show="submitting">Saving...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
