<!-- Admin Key Setup Modal -->
<div x-show="$store.app.showAdminKeySetup" class="modal-overlay" x-cloak style="display: none;">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">🔐 Admin Key Required</h2>
    </div>
    <div class="modal-body">
      <p style="margin-bottom: 1rem; color: #6b7280; line-height: 1.6;">
        Please enter your admin key to access the dashboard.
      </p>
      
      <div style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; line-height: 1.6;">
        <strong>First time setup?</strong><br>
        Run this command to create your admin key:<br>
        <code style="display: block; background: #1f2937; color: #10b981; padding: 0.75rem; border-radius: 0.375rem; margin-top: 0.5rem; font-family: monospace;">npx tsx scripts/bootstrap.ts</code>
        <div style="margin-top: 0.5rem; color: #6b7280;">
          💡 Save the generated admin key (starts with <code style="background: white; padding: 0.125rem 0.25rem;">ak_</code>) - you'll need it to log in!
        </div>
      </div>
      
      <form @submit.prevent="$store.app.setAdminKey($refs.apiKeyInput.value)">
        <div class="form-group">
          <label class="form-label" for="setup-api-key">Admin Key</label>
          <input 
            x-ref="apiKeyInput"
            type="password" 
            id="setup-api-key" 
            class="form-input" 
            placeholder="ak_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
            autocomplete="off"
            required
          />
          <p class="form-help" style="margin-top: 0.25rem;">Enter the admin key generated by the bootstrap script</p>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Save & Continue
        </button>
      </form>
    </div>
  </div>
</div>
