<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axon AI Gateway - Admin Dashboard</title>
  <link rel="stylesheet" href="/public/css/admin.css">
</head>
<body x-data x-cloak>
  <!-- Toast Container -->
  <div class="toast-container">
    <template x-for="toast in $store.toasts.items" :key="toast.id">
      <div class="toast" :class="`toast-${toast.type}`" x-show="true" x-transition>
        <span x-text="toast.message"></span>
        <button class="toast-close" @click="$store.toasts.remove(toast.id)">&times;</button>
      </div>
    </template>
  </div>

  <!-- API Key Setup Modal -->
  <div data-template="modals/api-key-setup"></div>

  <div class="admin-container">
    <!-- Sidebar -->
    <div data-template="sidebar"></div>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <h1 class="top-bar-title" x-text="$store.app.currentSection.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')"></h1>
        <div class="top-bar-actions">
          <!-- Workspace Selector -->
          <div x-data="workspacesManager" style="margin-right: 1rem; display: flex; gap: 0.5rem; align-items: center;">
            <select 
              x-show="workspaces.length > 0"
              class="form-select" 
              style="min-width: 150px;"
              @change="switchWorkspace(workspaces.find(w => w.id === $event.target.value))"
              :value="currentWorkspace?.id"
            >
              <template x-for="workspace in workspaces" :key="workspace.id">
                <option :value="workspace.id" x-text="workspace.name"></option>
              </template>
            </select>
            <button 
              class="btn btn-secondary btn-sm" 
              @click="showCreateModal = true"
              title="Create new workspace"
              style="padding: 0.375rem 0.5rem;"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width: 16px; height: 16px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
              </svg>
            </button>
            
            <!-- Quick Create Modal for Top Bar -->
            <div x-show="showCreateModal" class="modal-overlay" @click.self="showCreateModal = false" style="display: none;">
              <div class="modal">
                <div class="modal-header">
                  <h3 class="modal-title">Create New Workspace</h3>
                  <button class="modal-close" @click="showCreateModal = false">&times;</button>
                </div>
                <div class="modal-body">
                  <form @submit.prevent="createWorkspace()">
                    <div class="form-group">
                      <label class="form-label" for="quick-workspace-name">Workspace Name *</label>
                      <input 
                        type="text" 
                        id="quick-workspace-name"
                        class="form-input" 
                        x-model="formData.name"
                        placeholder="e.g., Production, Development"
                        required
                      />
                    </div>
                    
                    <div class="form-group">
                      <label class="form-label" for="quick-workspace-description">Description</label>
                      <textarea 
                        id="quick-workspace-description"
                        class="form-input" 
                        x-model="formData.description"
                        placeholder="Optional description"
                        rows="2"
                      ></textarea>
                    </div>
                    
                    <div class="modal-footer">
                      <button type="button" class="btn btn-secondary" @click="showCreateModal = false; resetForm()">
                        Cancel
                      </button>
                      <button type="submit" class="btn btn-primary" :disabled="submitting">
                        <span x-show="!submitting">Create</span>
                        <span x-show="submitting">Creating...</span>
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
            
            <!-- Admin Key Display Modal for Top Bar -->
            <div x-show="showAdminKeyModal" class="modal-overlay" @click.self="false" style="display: none;">
              <div class="modal">
                <div class="modal-header">
                  <h3 class="modal-title">Workspace Admin Key Created</h3>
                </div>
                <div class="modal-body">
                  <div style="background: #fef3c7; border: 1px solid #f59e0b; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem;">
                    <p style="color: #92400e; font-weight: 600; margin: 0 0 0.5rem;">Important: Save this key now!</p>
                    <p style="color: #92400e; font-size: 0.875rem; margin: 0;">This admin key will only be shown once. Store it securely.</p>
                  </div>
                  
                  <div class="form-group">
                    <label class="form-label">Admin Key</label>
                    <div style="display: flex; gap: 0.5rem;">
                      <input 
                        type="text" 
                        class="form-input" 
                        :value="createdAdminKey"
                        readonly
                        style="font-family: monospace; font-size: 0.875rem;"
                      />
                      <button 
                        class="btn btn-secondary" 
                        @click="Utils.copyToClipboard(createdAdminKey)"
                        title="Copy to clipboard"
                      >
                        Copy
                      </button>
                    </div>
                  </div>
                  
                  <div class="modal-footer">
                    <button class="btn btn-primary" @click="showAdminKeyModal = false; createdAdminKey = ''">
                      I've Saved This Key
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Gateway Running</span>
          </div>
        </div>
      </div>

      <div class="content-area">
        <!-- Dashboard Section -->
        <div data-template="sections/dashboard"></div>

        <!-- API Keys Section -->
        <div data-template="sections/api-keys"></div>

        <!-- Provider Keys Section -->
        <div data-template="sections/provider-keys"></div>

        <!-- Prompts Section -->
        <div data-template="sections/prompts"></div>

        <!-- Logs Section -->
        <div data-template="sections/logs"></div>

        <!-- Analytics Section -->
        <div data-template="sections/analytics"></div>

        <!-- Playground Section -->
        <div data-template="sections/playground"></div>

        <!-- Workspaces Section -->
        <div data-template="sections/workspaces"></div>

        <!-- Settings Section -->
        <div data-template="sections/settings"></div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script defer src="/public/js/utils.js"></script>
  <script defer src="/public/js/api-service.js"></script>
  <script defer src="/public/js/template-loader.js"></script>
  <script defer src="/public/js/app-init.js"></script>
  <script defer src="/public/js/components.js"></script>
  <script defer src="/public/js/alpine.min.js"></script>
</body>
</html>
